<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据输入与计算</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        header {
            background-color: #007BFF;
            color: white;
            padding: 20px 0;
            text-align: center;
        }
        nav {
            background-color: #0056b3;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        nav a:hover {
            background-color: #ddd;
            color: black;
        }
        .container {
            width: 80%;
            max-width: 1200px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            font-size: 1.2em;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>数据输入与计算</h1>
    </header>
    <nav>
        <a href="#about">关于我</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系我</a>
    </nav>
    <div class="container">
        <section id="about">
            <h2>关于我</h2>
            <p>你好！我是公彦良，一个热爱编程和技术的人。在这里分享我的技术心得和项目作品。</p>
        </section>
        <section id="projects">
            <h2>项目</h2>
            <ul>
                <li><strong>项目一：</strong> 数据输入与计算</li>
                <li><strong>项目二：</strong> 个人博客系统</li>
            </ul>
        </section>
        <section id="contact">
            <h2>联系我</h2>
            <p>可以通过以下方式联系我：</p>
            <ul>
                <li>Email: zhangsan@example.com</li>
                <li>GitHub: <a href="https://github.com/zhangsan" target="_blank">@zhangsan</a></li>
            </ul>
        </section>

        <!-- 表格输入数据 -->
        <section id="data-input">
            <h2>输入数据</h2>
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>数值</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><input type="number" class="data-input-field"></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td><input type="number" class="data-input-field"></td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td><input type="number" class="data-input-field"></td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td><input type="number" class="data-input-field"></td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td><input type="number" class="data-input-field"></td>
                    </tr>
                </tbody>
            </table>
            <button onclick="calculateSum()">计算总和</button>
            <button onclick="saveDataToFile()">保存数据到文件</button>
            <div class="result" id="sumResult"></div>
        </section>
    </div>
    <footer>
        <p>&copy; 2025 公彦良的所有权</p>
    </footer>

    <!-- 引入 FileSaver.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script>
        function calculateSum() {
            const inputs = document.querySelectorAll('.data-input-field');
            let sum = 0;
            inputs.forEach(input => {
                const value = parseFloat(input.value) || 0;
                sum += value;
            });
            document.getElementById('sumResult').textContent = `总和:  $ {sum}`;        }        function saveDataToFile() {            const inputs = document.querySelectorAll('.data-input-field');            let data = "序号,数值";            inputs.forEach((input, index) =﹥ {                data += ` $ {index + 1}, $ {input.value}
`;
            });

            const blob = new Blob([data], { type: 'text/csv;charset=utf-8;' });
            saveAs(blob, 'data.csv');
        }
    </script>
</body>
</html>
